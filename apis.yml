name: Oblenio Bio
description: 'Oblenio Bio is a clinical-stage biotechnology company developing tri-specific
  antibody immunotherapies for refractory autoimmune diseases. Its lead candidate,
  LBL-051, is a tri-specific T-cell engager targeting BCMA, CD19, and CD3 to deplete
  B-cells and pursue long-term, drug-free remission and immune reset for patients.
  Founded with support from Aditum Bio and surfaced through the GV portfolio, Oblenio
  Bio operates in the life-sciences sector and does not currently publish a public
  developer or API program.'
